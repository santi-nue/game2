 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Crystal Quest</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    canvas {
      display: block;
    }
    
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    
    #topBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      text-shadow: 0 0 10px #aef;
    }
    
    #shardCount {
      font-size: 24px;
      font-weight: bold;
    }
    
    #levelName {
      font-size: 20px;
      opacity: 0.8;
    }
    
    #abilities {
      display: flex;
      gap: 15px;
      pointer-events: auto;
      margin-bottom: 20px;
    }
    
    .ability-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #aef;
      background: rgba(0, 20, 40, 0.7);
      color: #aef;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s;
      text-shadow: 0 0 5px #aef;
      box-shadow: 0 0 10px rgba(170, 238, 255, 0.3);
    }
    
    .ability-btn:active {
      transform: scale(0.9);
      background: rgba(170, 238, 255, 0.2);
    }
    
    .ability-btn.cooldown {
      opacity: 0.4;
      pointer-events: none;
    }
    
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 20px #aef;
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    
    #startScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      pointer-events: auto;
      z-index: 100;
    }
    
    #startScreen h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 30px #aef;
      text-align: center;
    }
    
    #startScreen p {
      font-size: 18px;
      margin-bottom: 30px;
      text-align: center;
      max-width: 80%;
      opacity: 0.8;
    }
    
    #startBtn {
      padding: 15px 40px;
      font-size: 24px;
      background: linear-gradient(135deg, #aef, #06f);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(170, 238, 255, 0.5);
      transition: transform 0.2s;
    }
    
    #startBtn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui">
    <div id="topBar">
      <div id="levelName">Whispering Woods</div>
      <div id="shardCount">💎 0/3</div>
    </div>
    
    <div id="abilities">
      <button class="ability-btn" id="btnBurst">BURST</button>
      <button class="ability-btn" id="btnPull">PULL</button>
      <button class="ability-btn" id="btnSlow">SLOW</button>
    </div>
  </div>
  
  <div id="message"></div>
  
  <div id="startScreen">
    <h1>💎 Crystal Quest 💎</h1>
    <p>Collect all crystal shards to unlock the portal. Tap to move. Use abilities wisely!</p>
    <button id="startBtn">START QUEST</button>
  </div>
  
  <script src="game.js"></script>
</body>
</html>
