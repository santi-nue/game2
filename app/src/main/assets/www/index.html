<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Jungle Runner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none; /* prevent browser zoom/scroll on touch */
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #050510;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #score {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #00ffcc;
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 0 8px #00ffcc;
      letter-spacing: 1px;
    }
    #startScreen, #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 16, 0.75);
      pointer-events: auto;
    }
    #gameOverScreen {
      display: none;
    }
    h1 {
      color: #00ffcc;
      font-size: 36px;
      margin-bottom: 12px;
      text-shadow: 0 0 12px #00ffcc, 0 0 24px #00ffcc;
      text-align: center;
    }
    p {
      color: #a0e0ff;
      font-size: 16px;
      margin-bottom: 24px;
      text-align: center;
      max-width: 80%;
      line-height: 1.4;
    }
    button {
      background: linear-gradient(135deg, #00ffcc, #00ccff);
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      color: #050510;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 255, 204, 0.6);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    button:active {
      transform: scale(0.96);
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
    }
    #controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: auto;
    }
    .controlBtn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0, 255, 204, 0.15);
      border: 2px solid rgba(0, 255, 204, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00ffcc;
      font-size: 32px;
      font-weight: 700;
      user-select: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
    }
    .controlBtn:active {
      background: rgba(0, 255, 204, 0.35);
    }
    #jumpBtn {
      width: 90px;
      height: 90px;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    @media (min-width: 768px) {
      #controls {
        display: none; /* hide touch controls on desktop */
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="score">SCORE: 0</div>

    <div id="startScreen">
      <h1>NEON JUNGLE RUNNER</h1>
      <p>Run through a glowing cyber-jungle. Dodge neon vines and leap over glowing pits. Tap or use arrow keys to move.</p>
      <button id="startBtn">RUN</button>
    </div>

    <div id="gameOverScreen">
      <h1>GAME OVER</h1>
      <p id="finalScore">Score: 0</p>
      <button id="restartBtn">TRY AGAIN</button>
    </div>

    <div id="controls">
      <div style="display:flex; gap:16px;">
        <div class="controlBtn" id="leftBtn">◀</div>
        <div class="controlBtn" id="rightBtn">▶</div>
      </div>
      <div class="controlBtn" id="jumpBtn">JUMP</div>
    </div>
  </div>

  <script>
    // === SETUP ===
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    const jumpBtn = document.getElementById('jumpBtn');

    let width, height, scale;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scale = Math.min(width, height) / 100; // base scale factor
    }
    window.addEventListener('resize', resize);
    resize();

    // === GAME STATE ===
    let running = false;
    let score = 0;
    let speed = 200; // pixels per second
    let time = 0;

    // === PLAYER ===
    const player = {
      x: 0,
      y: 0,
      w: 40,
      h: 60,
      vx: 0,
      vy: 0,
      onGround: false,
      color: '#00ffcc'
    };

    // === INPUT ===
    const input = { left: false, right: false, jump: false };

    function setLeft(v) { input.left = v; }
    function setRight(v) { input.right = v; }
    function doJump() {
      if (player.onGround) {
        player.vy = -500 * scale;
        player.onGround = false;
      }
    }

    // Keyboard
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft') setLeft(true);
      if (e.code === 'ArrowRight') setRight(true);
      if (e.code === 'Space' || e.code === 'ArrowUp') doJump();
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft') setLeft(false);
      if (e.code === 'ArrowRight') setRight(false);
    });

    // Touch controls
    const addTouch = (el, onStart, onEnd) => {
      el.addEventListener('pointerdown', e => { e.preventDefault(); onStart(); });
      el.addEventListener('pointerup', e => { e.preventDefault(); onEnd(); });
      el.addEventListener('pointercancel', e => { e.preventDefault(); onEnd(); });
      el.addEventListener('pointerleave', e => { e.preventDefault(); onEnd(); });
    };
    addTouch(leftBtn, () => setLeft(true), () => setLeft(false));
    addTouch(rightBtn, () => setRight(true), () => setRight(false));
    addTouch(jumpBtn, () => doJump(), () => {});

    // === WORLD ===
    const groundHeight = 80;
    let cameraX = 0;

    // Parallax layers
    const layers = [
      { speed: 0.2, color: '#1a1a3a', elements: [] }, // far mountains
      { speed: 0.5, color: '#2a2a5a', elements: [] }, // mid trees
      { speed: 1.0, color: '#3a3a7a', elements: [] }  // near foliage
    ];

    function generateLayerElement(layerIndex, x) {
      const layer = layers[layerIndex];
      const baseY = height - groundHeight;
      if (layerIndex === 0) {
        // mountains
        const h = 80 + Math.random() * 120;
        return { x, y: baseY - h, w: 60 + Math.random() * 80, h, type: 'mountain' };
      } else if (layerIndex === 1) {
        // trees
        const h = 60 + Math.random() * 100;
        return { x, y: baseY - h, w: 20 + Math.random() * 30, h, type: 'tree' };
      } else {
        // near foliage
        const h = 30 + Math.random() * 50;
        return { x, y: baseY - h, w: 15 + Math.random() * 25, h, type: 'bush' };
      }
    }

    function initLayers() {
      layers.forEach((layer, i) => {
        layer.elements = [];
        for (let x = -200; x < width + 400; x += 80 + Math.random() * 60) {
          layer.elements.push(generateLayerElement(i, x));
        }
      });
    }

    // Obstacles
    const obstacles = [];
    function spawnObstacle() {
      const baseY = height - groundHeight;
      const type = Math.random() < 0.5 ? 'vine' : 'pit';
      if (type === 'vine') {
        obstacles.push({
          x: cameraX + width + 100,
          y: baseY - 70 - Math.random() * 40,
          w: 25,
          h: 70 + Math.random() * 50,
          type: 'vine',
          color: '#ff0066'
        });
      } else {
        obstacles.push({
          x: cameraX + width + 100,
          y: baseY,
          w: 60 + Math.random() * 60,
          h: 20,
          type: 'pit',
          color: '#ffaa00'
        });
      }
    }

    // Particles (fireflies)
    const particles = [];
    function spawnParticle() {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * (height - groundHeight),
        vx: (Math.random() - 0.5) * 20,
        vy: (Math.random() - 0.5) * 20,
        life: 2 + Math.random() * 3,
        color: `hsl(${40 + Math.random() * 40}, 100%, 60%)`
      });
    }

    // === GAME LOOP ===
    let lastTime = 0;
    let obstacleTimer = 0;

    function resetGame() {
      player.x = width * 0.2;
      player.y = height - groundHeight - player.h;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      cameraX = 0;
      score = 0;
      speed = 200;
      time = 0;
      obstacles.length = 0;
      particles.length = 0;
      initLayers();
      scoreEl.textContent = 'SCORE: 0';
    }

    function update(dt) {
      time += dt;
      score += dt * speed * 0.01;
      scoreEl.textContent = 'SCORE: ' + Math.floor(score);

      // Increase speed gradually
      speed += dt * 2;

      // Player movement
      const accel = 1200 * scale;
      const maxSpeed = 250 * scale;
      const friction = 0.85;

      if (input.left) player.vx -= accel * dt;
      if (input.right) player.vx += accel * dt;
      if (!input.left && !input.right) player.vx *= friction;

      // Clamp speed
      if (player.vx > maxSpeed) player.vx = maxSpeed;
      if (player.vx < -maxSpeed) player.vx = -maxSpeed;

      player.x += player.vx * dt;

      // Keep player in bounds
      if (player.x < 0) { player.x = 0; player.vx = 0; }
      if (player.x + player.w > width) { player.x = width - player.w; player.vx = 0; }

      // Gravity
      const gravity = 1800 * scale;
      player.vy += gravity * dt;
      player.y += player.vy * dt;

      const groundY = height - groundHeight - player.h;
      if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      // Camera follows player slightly
      const targetCamX = player.x - width * 0.25;
      cameraX += (targetCamX - cameraX) * 5 * dt;

      // Update parallax layers
      layers.forEach((layer, i) => {
        const parallaxSpeed = speed * layer.speed * dt;
        layer.elements.forEach(el => {
          el.x -= parallaxSpeed;
        });
        // Recycle elements
        layer.elements = layer.elements.filter(el => el.x + el.w > -200);
        while (layer.elements[layer.elements.length - 1].x < width + 200) {
          const lastX = layer.elements[layer.elements.length - 1].x;
          layer.elements.push(generateLayerElement(i, lastX + 80 + Math.random() * 60));
        }
      });

      // Obstacles
      obstacleTimer += dt;
      if (obstacleTimer > 1.2 - Math.min(0.8, speed * 0.001)) {
        spawnObstacle();
        obstacleTimer = 0;
      }

      obstacles.forEach(obs => {
        obs.x -= speed * dt;
      });
      // Remove off-screen obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        if (obstacles[i].x + obstacles[i].w < -100) {
          obstacles.splice(i, 1);
        }
      }

      // Particles
      if (Math.random() < 0.1) spawnParticle();
      particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      });
      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      // Collision
      const playerRect = { x: player.x, y: player.y, w: player.w, h: player.h };
      for (const obs of obstacles) {
        if (rectOverlap(playerRect, obs)) {
          gameOver();
          return;
        }
      }
    }

    function rectOverlap(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, width, height);

      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#050510');
      skyGrad.addColorStop(1, '#101030');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Parallax layers
      layers.forEach(layer => {
        ctx.fillStyle = layer.color;
        layer.elements.forEach(el => {
          if (el.type === 'mountain') {
            ctx.beginPath();
            ctx.moveTo(el.x, el.y + el.h);
            ctx.lineTo(el.x + el.w * 0.5, el.y);
            ctx.lineTo(el.x + el.w, el.y + el.h);
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.fillRect(el.x, el.y, el.w, el.h);
          }
        });
      });

      // Ground
      const groundGrad = ctx.createLinearGradient(0, height - groundHeight, 0, height);
      groundGrad.addColorStop(0, '#00ffcc');
      groundGrad.addColorStop(1, '#006655');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, height - groundHeight, width, groundHeight);

      // Obstacles
      obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 15;
        if (obs.type === 'vine') {
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        } else {
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        }
        ctx.shadowBlur = 0;
      });

      // Player
      ctx.fillStyle = player.color;
      ctx.shadowColor = player.color;
      ctx.shadowBlur = 20;
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.shadowBlur = 0;

      // Particles (fireflies)
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 3);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function loop(timestamp) {
      if (!running) return;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    function startGame() {
      resetGame();
      running = true;
      lastTime = performance.now();
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      requestAnimationFrame(loop);
    }

    function gameOver() {
      running = false;
      finalScoreEl.textContent = 'Score: ' + Math.floor(score);
      gameOverScreen.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Initial draw
    resize();
    initLayers();
    draw();
  </script>
</body>
</html>
